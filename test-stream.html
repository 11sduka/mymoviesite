<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Парсинг Тест Стриминга</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@clappr/player@latest/dist/clappr.min.js"></script>
    <style>
        body { background-color: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        #player { max-width: 800px; margin: 20px auto; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
    </style>
</head>
<body>

    <h2>Тест парсинга прямого эфира Турции (M3U8)</h2>
    <p>Проверяем стриминг канала TRT 1 (Сериал Gönül Dağı)</p>

    <div id="player"></div>

    <script>
        var player = new Clappr.Player({
            // Это прямая серверная ссылка на эфир, которую мы спарсили
            source: "https://atv-live.akamaized.net/hls/live/2034177/atv_canli/atv_canli_high.m3u8", 
            parentId: "#player",
            width: "100%",
            height: "450px",
            autoPlay: true
        });
    </script>

</body>
</html>
